name: public-content-hygiene

# Roy's ruling as a green check: r2-hive is PUBLIC and the pilot-site location name + te-reo terms are
# scrubbed at HEAD pending the Māori-reviewer gate. This is the SEED hosted workflow for r2-hive (the
# audit found none existed); it guards against accidental reintroduction via a re-vendor or careless commit.
on:
  push:
  pull_request:

jobs:
  scrub-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ★ SHAPES-ONLY backstop (supervisor ruling 2026-07-27, option b). The VALUE-class list (scrubbed
      # location/cultural terms, gateway-product name, bench/personal hostnames) rides an OUT-OF-REPO
      # per-host denylist that the runner deliberately does NOT hold — so CI runs SHAPE/signal classes
      # only (MAC/tail, RFC1918+CGNAT IP, dashed-UUID, API-key, te-reo macron). This does NOT weaken
      # value-class coverage: the pre-push gate runs load_denylist which FAILS CLOSED, so a host without
      # the denylist CANNOT PUSH — the value invariant is enforced-or-refused, never silently unchecked.
      # The flag is explicit; WITHOUT it the script fails closed on a missing denylist (never an accidental
      # partial pass). Injecting the denylist as a CI secret was REJECTED (a new copy in a third-party store).
      - name: Public-content hygiene (shape/signal classes — value-classes enforced pre-push)
        run: bash ci/public-hygiene.sh --ci-shapes-only
